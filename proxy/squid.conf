# Allowlist-only forward proxy. Default is deny.

acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# The only allow rule in the file.
http_access allow allowed_domains

# Everything else, including anything from the host, is refused.
http_access deny all

http_port 3128

# No caching: a cache is state, and state in the egress path is a place
# for one script's fetch to be served to another script.
cache deny all
cache_store_log none

# Refusals are the signal worth reading — a script reaching for a
# hostname nobody declared. Log to stdout so `podman logs` shows it.
logfile_rotate 0
access_log stdio:/dev/stdout squid
cache_log /dev/stderr

# Do not announce the proxy or the client to the origin server.
via off
forwarded_for delete
httpd_suppress_version_string on

dns_v4_first on
shutdown_lifetime 5 seconds
